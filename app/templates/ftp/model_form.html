{% extends "layout/base.html" %}

{% block title %}New FTP Model{% endblock %}

{% block content %}
<div class="mb-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('ftp.model_list') }}">FTP Models</a></li>
            <li class="breadcrumb-item active">New Model</li>
        </ol>
    </nav>
    <h2><i class="bi bi-diagram-3"></i> Create FTP Model</h2>
</div>

<div class="card shadow-sm" style="max-width: 600px;">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Model Name</label>
                <input type="text" name="model_name" class="form-control" required placeholder="e.g. Standard 2026 Pricing">
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Explain the business cases for this model..."></textarea>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" name="is_active" id="isActive" checked>
                <label class="form-check-label" for="isActive">Model is Active</label>
            </div>
            <hr>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Create Model</button>
            <a href="{{ url_for('ftp.model_list') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
